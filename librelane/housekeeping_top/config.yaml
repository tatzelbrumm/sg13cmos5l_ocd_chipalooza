meta:
  version: 2
  flow: Classic
  substituting_steps:
    
    # Allow assignments for por, porb
    Checker.NetlistAssignStatements: null
    
    # For debugging
    +OpenROAD.GeneratePDN: Magic.StreamOut
    
    # Ignore disconnected pins
    Checker.DisconnectedPins: null
    
    # TODO reenable again?
    OpenROAD.IRDropReport: null
    
    # Not needed
    Magic.WriteLef: null
    Odb.CheckDesignAntennaProperties: null
    
    # Magic has no issues with DRC
    # Magic.DRC: null
    
    # NOTE:  KLayout.StreamOut / KLayout.XOR / KLayout.DRC / Netgen.LVS
    # are disabled through the RUN_* flow control variables below rather
    # than nulled here.  Nulling a step leaves its Checker behind with
    # nothing to check, which produced the
    #   "The XOR differences metric was not found."
    # message;  the flow control variables drop the checkers too.
    
    # Some macros may overlap on purpose
    Checker.IllegalOverlap: null

# Signoff tool selection and flow control
#
# THE IMPORTANT ONE:  the IHP PDK sets PRIMARY_GDSII_STREAMOUT_TOOL to
# "klayout", and Magic.StreamOut only registers the GDS view when this is
# "magic".  With KLayout's streamout disabled nothing produced a GDS at
# all, so Magic.DRC --- which takes DesignFormat.GDS as a REQUIRED input
# --- aborted before running, leaving an empty step directory and an
# empty error.log.  That is why the flow always stopped short of DRC.
PRIMARY_GDSII_STREAMOUT_TOOL: magic

# KLayout streamout off, which also drops KLayout.XOR and Checker.XOR.
# Note this means the magic-vs-klayout GDS cross-check is not running.
RUN_KLAYOUT_STREAMOUT: false
RUN_KLAYOUT_XOR: false

# KLayout DRC and LVS are run manually from validate/.  Disabling them
# here also drops Checker.KLayoutDRC and Checker.LVS.
RUN_KLAYOUT_DRC: false
RUN_LVS: false

DESIGN_NAME: housekeeping_top
VERILOG_FILES:
- dir::../../verilog/rtl/synth_defs.v
- dir::../../verilog/rtl/housekeeping_spi.v
- dir::../../verilog/rtl/housekeeping.v
- dir::../../verilog/rtl/sequencer.v
- dir::../../verilog/rtl/pattern.v
- dir::../../verilog/rtl/router.v
- dir::../../verilog/rtl/lfsr.v
- dir::../../verilog/rtl/housekeeping_top.v

DEDUPLICATE_CORNERS: true

# Use the IHP CMOS5L standard cell library
STD_CELL_LIBRARY: sg13cmos5l_stdcell

# Technology libs
LIB:
  "nom_typ_1p20V_25C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib

  "nom_typ_1p50V_25C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_typ_1p50V_25C.lib

  "nom_slow_1p35V_125C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_slow_1p35V_125C.lib

  "nom_slow_1p08V_125C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_slow_1p08V_125C.lib

  "nom_fast_1p32V_m40C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_fast_1p32V_m40C.lib

  "nom_fast_1p65V_m40C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_fast_1p65V_m40C.lib


# Corners
STA_CORNERS:
  - nom_typ_1p20V_25C
  - nom_typ_1p50V_25C
  - nom_slow_1p35V_125C
  - nom_slow_1p08V_125C
  - nom_fast_1p32V_m40C
  - nom_fast_1p65V_m40C

CTS_CLK_BUFFERS:
  - "sg13cmos5l_buf_8"
  - "sg13cmos5l_buf_4"
  - "sg13cmos5l_buf_2"

DEFAULT_CORNER: nom_typ_1p20V_25C

# Magic streamout: don't blackbox macros
MAGIC_MACRO_STD_CELL_SOURCE: PDK

# Don't short top-level pins
MAGIC_EXT_SHORT_RESISTOR: true

# IGNORE_DISCONNECTED_MODULES:
#     - manual_routing

# Prevent porb_h mangling
SYNTH_DIRECT_WIRE_BUFFERING: False
SYNTH_WRITE_NOATTR: False

# Ignores don't touch directive
PL_TIME_DRIVEN: False

# Clock
# BOTH clocks must be listed.  CLOCK_PORT feeds CLOCK_NET, which is the
# list CTS uses to decide what to build a tree for --- so with only "clk"
# here, CTS never built one for SCK at all.  That is the direct cause of
# the 324 unclocked register pins in the previous run:  the ~325 SCK
# flops got whatever the resizer's max-fanout repair produced instead of
# a balanced tree.
CLOCK_NET: [clk, SCK]
CLOCK_PORT: [clk, SCK]

# The primary period.  SCK's 100 ns is set in constraints.sdc;  this
# value is what LibreLane derives its own defaults from.
CLOCK_PERIOD: 15

# SDC
# FALLBACK_SDC (deprecated name FALLBACK_SDC_FILE) only ever constrains
# the FIRST entry of CLOCK_PORT, which is why the templated base.sdc
# could never describe this block.  base.sdc is now unused.
#
# Two files, not one:  sram_clk is a clock mux output needing two
# generated clocks on one port.  OpenSTA accepts that, TritonCTS does not
# ("[ERROR CTS-0114] Clock sram_clk_s overlaps a previous clock"), so PnR
# analyses the sequencer mode only via a case analysis and signoff
# analyses both.  Both source constraints_common.sdc.
PNR_SDC_FILE: dir::constraints_pnr.sdc
SIGNOFF_SDC_FILE: dir::constraints_signoff.sdc

# CTS
CTS_OBSTRUCTION_AWARE: true
# CTS_CLK_MAX_WIRE_LENGTH removed.  Its default is 0, which lets
# TritonCTS pick the segment length itself;  the explicit 1200 um was an
# override roughly the width of the whole block, so the tree went almost
# unbuffered.  Combined with no max_transition constraint, that produced
# 4.589 ns of clock skew and 56 max-slew violations at
# nom_slow_1p08V_125C, with a 468 um average leaf wire on 112 sinks.
# max_transition is now set in constraints.sdc.
CTS_SINK_CLUSTERING_SIZE: 25 # default 25
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60 # default 50

# Routing
GRT_ALLOW_CONGESTION: true
# NOTE:  Changed to false to check for congestion issues early
## GRT_ALLOW_CONGESTION: false
RT_CLOCK_MAX_LAYER: Metal4
#RT_MAX_LAYER: Metal4
#DRT_MAX_LAYER: Metal4

# Resizer
# RSZ_DONT_TOUCH_RX: porb_l|por_l
DESIGN_REPAIR_BUFFER_INPUT_PORTS: false
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false

# Overfix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.2

VDD_NETS:
- vddd

GND_NETS:
- vssd

PDN_CORE_RING: false

# FP_PDN_CFG: dir::pdn_cfg.tcl

# FP_PDN_VWIDTH: 2.0
# FP_PDN_HWIDTH: 5.0
# FP_PDN_VSPACING: 1.7
# FP_PDN_HSPACING: 1.7
# FP_PDN_VPITCH: 55
# FP_PDN_HPITCH: 70

# FP_PDN_CORE_RING: true
# FP_PDN_CORE_RING_VWIDTH: 8
# FP_PDN_CORE_RING_HWIDTH: 8

# FP_PDN_CORE_RING_VOFFSET: 2
# FP_PDN_CORE_RING_HOFFSET: 2

# Floorplanning
FP_SIZING: absolute

DIE_AREA: [ 640.00,  300.00, 1895.00, 430.00 ]
CORE_AREA: [ 641.50,  301.50, 1893.50, 428.50 ]

FP_DEF_TEMPLATE: dir::../../def/housekeeping_top.def
FP_TEMPLATE_MATCH_MODE: permissive
#FP_TEMPLATE_COPY_POWER_PINS: True

PL_TARGET_DENSITY_PCT: 50 # Adjust as needed

# FP_OBSTRUCTIONS:
## SRAM
# - [2651.15, 0.00, 3170.30, 55.215]
## ADC/DAC area
# - [790, 0.00, 1720, 290]

# Obstructions
#
# Odb.ApplyDEFTemplate only relocates pins and reads the die area out of
# FP_DEF_TEMPLATE.  It does NOT import the BLOCKAGES section, so the
# obsm* shapes painted by scripts/run_gen_hk_def.tcl have no effect on
# the flow and must be restated here.  Keep the two in step.
#
# Layer names are LEF names.  magic's "m4"/metal4 is Metal4;  its
# "m5"/metal5 is TopMetal1.
#
# This keepout lets the 3.3 V supply reach up from the pad in the lower
# right corner, over the right-hand end of this block.  It mirrors the
# two boxes at the end of run_gen_hk_def.tcl:
#     obsm5  (die_urx-33, die_lly+25) .. (die_urx, die_ury-60)
#     obsm4  (die_urx-33, die_lly+25) .. (die_urx, die_ury)

PDN_OBSTRUCTIONS:
- [TopMetal1, 1862.00, 325.00, 1895.00, 370.00]
- [Metal4, 1862.00, 325.00, 1895.00, 430.00]

ROUTING_OBSTRUCTIONS:
- [TopMetal1, 1862.00, 325.00, 1895.00, 370.00]
- [Metal4, 1862.00, 325.00, 1895.00, 430.00]

# NOTE:  run_gen_hk_def.tcl also paints 1 um obsm1..obsm4 strips along
# all four die edges over the pins.  Those are deliberately NOT restated
# here:  the pin shapes are only 2 um long, so a 1 um same-layer routing
# blockage would cover half of every pin.  The 3 um CORE_AREA margin
# already keeps placement and most routing off the die edge.

# Magic: Use GDS views (no DRC issues)
MAGIC_DRC_USE_GDS: True

# Allow top ports to be non-unique (because power names are duplicated)
MAGIC_EXT_UNIQUE: notopports

MACROS:

PDN_MACRO_CONNECTIONS:

